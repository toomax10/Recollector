name: Ejecutor Diario de Opciones

on:
  schedule:
    # 9:45 AM, 1:15 PM y 3:45 PM NY (Hora UTC)
    - cron: '45 14 * * 1-5'
    - cron: '15 18 * * 1-5'
    - cron: '45 20 * * 1-5'
  workflow_dispatch: # Te permite probarlo manualmente

jobs:
  recolectar:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar dependencias
      #run: pip install yfinance numpy pandas
      run: pip install yfinance numpy pandas google-api-python-client google-auth

    - name: Ejecutar script recolector
      run: python recolector_opciones.py
      env:
        # Inyecta el contenido de tu archivo JSON directamente al entorno
        GDRIVE_CREDENTIALS: ${{ secrets.GCP_JSON }}
